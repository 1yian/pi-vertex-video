name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  native-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: git diff --exit-code -- dist
      - name: Native Pi end-to-end tests
        shell: bash
        run: npm run test:e2e 2>&1 | tee "$RUNNER_TEMP/native-e2e.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-e2e-node-${{ matrix.node }}
          path: ${{ runner.temp }}/native-e2e.log
          if-no-files-found: ignore
